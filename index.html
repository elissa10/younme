<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이(AI)티콘 클래스</title>
    <style>
        :root {
            --main-purple: #74ebd5;
            --main-blue: #acb6e5;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, var(--main-blue), var(--main-purple));
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 30px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-link {
            display: block;
            padding: 18px;
            background: white;
            border: 2px solid #eee;
            border-radius: 15px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease-in-out;
            text-align: left; /* 메뉴 가독성을 위해 왼쪽 정렬 */
        }

        .menu-link span {
            margin-right: 10px;
            color: #888;
            font-size: 0.9rem;
        }

        .menu-link:hover {
            border-color: #acb6e5;
            background-color: #f8f9ff;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo">🤖🎨</div>
        <h1>아이(AI)티콘 만들기 수업</h1>
        
        <nav class="menu-list">
            <a href="/aiticon/mood.html" class="menu-link"><span>1.</span> 반가워요! 지금 기분이 어때요?</a>
            <a href="/aiticon/draw.html" class="menu-link"><span>2.</span> 어떤 그림 스타일로 그릴까요?</a>
            <a href="/aiticon/character.html" class="menu-link"><span>3.</span> 내 캐릭터 만들기</a>
            <a href="/aiticon/emotion.html" class="menu-link"><span>4.</span> 표정 스티커 만들기</a>
        </nav>

        <div class="footer">
            AI-ticon Class © 2026
        </div>
    </div>

</body>
</html>
